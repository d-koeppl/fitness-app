name: CI

# Every change reaches main through a pull request (CLAUDE.md), so that is
# what this gates. The push trigger keeps main's own status visible.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: functions (ruff + pytest on the Firestore emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The Cloud Functions runtime in firebase.json.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: functions/requirements-dev.txt

      # The Firestore emulator is a Java program started by the Firebase CLI.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          pip install -r functions/requirements-dev.txt
          npm install -g firebase-tools@15.31.0

      - name: Lint
        working-directory: functions
        run: ruff check .

      - name: Test
        # Inside emulators:exec, so the store tests run against a real
        # Firestore; REQUIRE_FIRESTORE_EMULATOR turns a missing emulator
        # into a failure instead of a skip. Includes the check that
        # openapi/openapi.json matches the app.
        env:
          REQUIRE_FIRESTORE_EMULATOR: "1"
        run: firebase emulators:exec --only firestore --project demo-fitness-test "cd functions && python -m pytest"

  app:
    name: app (analyze + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Build Android
        run: flutter build apk --debug
