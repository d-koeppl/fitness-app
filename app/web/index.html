<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    Flutter adds its own viewport tag at start-up. Without this one the
    loading screen is first laid out at desktop width and jumps when it does.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal fitness dashboard: calendar, health, and match performance in one place.">
  <meta name="theme-color" content="#1E8E3E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fitness">
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Fitness Dashboard</title>
  <link rel="manifest" href="manifest.json">

  <!--
    A loading screen in plain HTML, painted before the Flutter engine has
    downloaded (several MB on a phone link). Flutter's view covers it, and
    the script below removes it on the engine's first frame.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #fafbfe; }
    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
      font: 500 22px/1.3 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #1b1c1e;
    }
    #splash img { width: 160px; height: 160px; border-radius: 36px; }
    #splash p { margin: 0; }
    #splash .hint { font-size: 14px; font-weight: 400; color: #44474a; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #121316; }
      #splash { color: #e3e2e6; }
      #splash .hint { color: #c4c6ca; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="icons/Icon-192.png" alt="" width="160" height="160">
    <p>Fitness Dashboard</p>
    <p class="hint">Loading…</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('splash')?.remove(), { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
