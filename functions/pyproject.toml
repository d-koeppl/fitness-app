# Tooling config for the Cloud Functions code. There is no packaging here:
# Firebase deploys this directory as-is and imports main.py from it.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
# Starlette's TestClient now prefers httpx2 over httpx; httpx still works
# and is what the fitness-dashboard CI already installs. Revisit when
# moving the test client over deliberately.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["venv"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, comprehensions.
select = ["E", "F", "I", "UP", "B", "C4"]
# B008 flags calls in default arguments, which is exactly how FastAPI
# declares dependencies and query parameters (`Depends(...)`, `Query()`).
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["api", "tools", "main"]
